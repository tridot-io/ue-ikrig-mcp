[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ue-ikrig-mcp"
version = "0.7.0"
description = "MCP server for creating and fine-tuning IK Rigs and IK Retargeters in Unreal Engine 5"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]
readme = "README.md"
license = "MIT"

[project.urls]
Repository = "https://github.com/tridot-io/ue-ikrig-mcp"

[project.scripts]
ue-ikrig-mcp = "ue_ikrig_mcp.server:main"

# Make sure shipped JSON data files (skeleton fingerprints, presets, schema)
# and the preset README land in the wheel alongside the Python sources.
[tool.hatch.build.targets.wheel]
packages = ["src/ue_ikrig_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/ue_ikrig_mcp/data" = "ue_ikrig_mcp/data"